<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriverPoE</title>
<style>
  :root {
    --bg: #060814; --ink: #f6f7ff; --muted: #a9afc7; --line: #ffffff1c;
    --hot: #d6ff43; --violet: #8c63ff; --panel: #111526d9;
    --danger: #ff6172; --warn: #ffbd5c;
    /* Aliases so the rest of this file (and the .pill/.msg states below,
       written against the old --bg/--fg/--card/--border/--accent/--ok
       names) didn't need touching. */
    --fg: var(--ink); --card: var(--panel); --border: var(--line);
    --accent: var(--violet); --ok: var(--hot);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 14px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; overflow-x: hidden;
  }
  body:before {
    content: ""; position: fixed; inset: -30%; z-index: -2;
    background: radial-gradient(circle at 22% 20%, #6c3eda99, transparent 25%),
                radial-gradient(circle at 78% 30%, #1e7ce58c, transparent 25%),
                radial-gradient(circle at 50% 95%, #b6dd2560, transparent 30%);
    filter: blur(30px); animation: drift 12s ease-in-out infinite alternate;
  }
  @keyframes drift { to { transform: scale(1.13) rotate(6deg); } }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); backdrop-filter: blur(18px);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 20px; letter-spacing: -.03em; margin: 0; flex: 1; }
  header input, header select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
    background: #070a18; color: var(--fg); font: inherit; font-size: 13px;
  }
  header button {
    appearance: none; padding: 8px 16px; border: 1px solid var(--violet); border-radius: 10px;
    background: var(--violet); color: #fff; font: inherit; font-weight: 650; cursor: pointer; transition: .18s;
  }
  header button:hover:not(:disabled) { transform: translateY(-2px); }
  header button:disabled { opacity: .5; cursor: default; }
  main { padding: 20px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    backdrop-filter: blur(18px); box-shadow: 0 18px 50px #0006; padding: 18px;
  }
  .card h2 { font-size: 16px; letter-spacing: -.02em; margin: 0 0 4px; padding-right: 28px; }
  .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; font-size: 13px; }
  .row .label { color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .pill.on { background: #d6ff4322; color: var(--hot); }
  .pill.off { background: #ffffff14; color: var(--muted); }
  .pill.warn { background: #ffbd5c22; color: var(--warn); }
  .pill.err { background: #ff617222; color: var(--danger); }
  /* Shared style for every button inside a card -- On/Off/Identify, Get
     status, Reboot/Factory reset/Change secret, Upload firmware all use
     this SAME rule, so they're identical in size/font/style; .btn-danger
     only overrides color, everything else (padding, border-radius, font,
     min-width) stays shared. */
  .btn {
    min-width: 92px; padding: 7px 12px; border: 1px solid #ffffff28; border-radius: 8px;
    background: #ffffff0c; color: var(--fg); cursor: pointer; font: inherit; font-weight: 650;
    font-size: 12px; text-align: center; transition: .18s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); border-color: #fff7; background: #ffffff1d; }
  .btn:disabled { opacity: .48; cursor: default; }
  .btn-danger { color: var(--danger); border-color: #ff617255; }
  .btn-fill { flex: 1; min-width: 0; } /* the 6 On/Off/Identify + Reboot/Factory reset/Change secret buttons -- each fills 1/3 of its row instead of the shared min-width */
  .controls { margin-top: 10px; }
  .controls-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .controls-row:first-child { margin-top: 0; }
  .dim-wrap { position: relative; flex: 1; min-width: 100px; display: flex; align-items: center; }
  .dim-wrap input[type=range] { width: 100%; vertical-align: middle; accent-color: var(--hot); }
  .dim-tip { position: absolute; bottom: 100%; transform: translateX(-50%); margin-bottom: 4px; padding: 2px 6px; border-radius: 4px; background: var(--ink); color: #0b0d1a; font-size: 11px; font-weight: 700; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .1s; }
  .dim-tip.show { opacity: 1; }
  .msg { margin-top: 8px; font-size: 12px; padding: 6px 8px; border-radius: 8px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: #d6ff431a; color: var(--hot); }
  .msg.err { background: #ff61721a; color: var(--danger); }
  .empty { color: var(--muted); padding: 40px; text-align: center; grid-column: 1 / -1; }
  dialog {
    border-radius: 16px; border: 1px solid var(--border); padding: 18px;
    background: #171b2fee; backdrop-filter: blur(18px); color: var(--fg); box-shadow: 0 24px 60px #0008;
  }
  dialog::backdrop { background: #04050bb0; }
  dialog input[type=text] { width: 100%; padding: 8px 10px; margin: 8px 0 14px; border: 1px solid var(--border); border-radius: 8px; background: #070a18; color: var(--fg); font: inherit; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .card .info { margin: 8px 0 4px; }
  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--hot); margin: 0 0 6px; }
  .section-label-sub { margin-top: 10px; } /* a sub-heading within the same divider-bounded section (e.g. "Admin controls" under "Controls") -- some breathing room from the group above, no full divider needed */
  .card hr.divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .center-row { display: flex; justify-content: center; margin-top: 8px; }
  .dim-row { align-items: center; }
  .dim-label { font-size: 13px; color: var(--muted); min-width: 56px; }
  .ota { margin-top: 6px; }
  .ota-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ota-row input[type=file] {
    flex: 1; min-width: 120px; font: inherit; font-size: 12px; color: var(--fg);
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: #070a18;
  }
  /* The browser's own "Choose file" sub-button, styled to match .btn --
     ::file-selector-button is the standard pseudo-element (Chrome/Edge/
     Firefox); ::-webkit-file-upload-button is Safari's older equivalent
     of the same thing, kept alongside for it specifically. */
  .ota-row input[type=file]::file-selector-button,
  .ota-row input[type=file]::-webkit-file-upload-button {
    margin-right: 8px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: #ffffff0c; color: var(--fg); font: inherit; font-size: 12px; cursor: pointer;
  }
  .ota-row input[type=file]:hover::file-selector-button,
  .ota-row input[type=file]:hover::-webkit-file-upload-button { border-color: #fff7; }
  .ota-progress { display: none; margin-top: 6px; height: 16px; border-radius: 99px; background: #ffffff13; border: 1px solid var(--border); overflow: hidden; }
  .ota-progress.show { display: block; }
  .ota-bar {
    height: 100%; width: 0%; background: var(--hot);
    color: #0b0d1a; font-size: 10px; font-weight: 700;
    line-height: 16px; text-align: center; white-space: nowrap; transition: width .2s;
  }

  .select-check { position: absolute; top: 12px; right: 12px; width: 18px; height: 18px; cursor: pointer; accent-color: var(--hot); }
  .card { position: relative; }

  .bulk-bar { display: none; background: var(--panel); backdrop-filter: blur(18px); border-bottom: 1px solid var(--border); padding: 10px 20px; }
  .bulk-bar.show { display: block; }
  .bulk-bar .bulk-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .bulk-bar .bulk-row:first-child { margin-top: 0; }
  .bulk-count { font-size: 13px; font-weight: 700; margin-right: 4px; color: var(--hot); }
  .bulk-bar .btn { min-width: 0; padding: 6px 12px; }
  .bulk-dim-wrap { position: relative; flex: 1; min-width: 140px; max-width: 260px; display: flex; align-items: center; }
  .bulk-dim-wrap input[type=range] { width: 100%; accent-color: var(--hot); }
</style>
</head>
<body>
<header>
  <h1>DriverPoE</h1>
  <select id="bcastSelect" onchange="applyBcastSelection(this)">
    <option value="">Interface...</option>
  </select>
  <input id="bcast" type="text" placeholder="broadcast (auto)" size="16">
  <button id="scanBtn" onclick="scanDevices()">Scan network</button>
</header>

<div class="bulk-bar" id="bulkBar">
  <div class="bulk-row">
    <span class="bulk-count" id="bulkCount">0 selected</span>
    <button class="btn" onclick="bulkOn()">On</button>
    <button class="btn" onclick="bulkOff()">Off</button>
    <button class="btn" onclick="bulkIdentify()">Identify</button>
    <button class="btn" onclick="bulkStatus()">Get status</button>
    <div class="bulk-dim-wrap">
      <span class="dim-tip" id="bulk-dim-tip">50%</span>
      <input type="range" id="bulkDimSlider" min="0" max="100" step="1" value="50"
             oninput="bulkDimInput(this)" onchange="bulkDimCommit(this)">
    </div>
    <button class="btn" onclick="clearSelection()">Clear selection</button>
  </div>
  <div class="bulk-row">
    <button class="btn btn-danger" onclick="bulkReboot()">Reboot</button>
    <button class="btn btn-danger" onclick="bulkFactoryReset()">Factory reset</button>
    <button class="btn btn-danger" onclick="bulkChangeSecret()">Change secret</button>
  </div>
</div>

<main id="devices"><div class="empty">Click "Scan network" to discover luminaires on this LAN.</div></main>

<dialog id="secretDialog">
  <form method="dialog" onsubmit="return false">
    <div id="secretDialogMsg" style="margin-bottom:8px;color:var(--muted);font-size:13px;"></div>
    <input id="secretDialogInput" type="text" placeholder="64 hex characters" maxlength="64">
    <div class="actions">
      <button type="button" onclick="document.getElementById('secretDialog').close()">Cancel</button>
      <button type="button" id="secretDialogOk" style="background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:6px;">Try</button>
    </div>
  </form>
</dialog>

<script>
// ----------------------------------------------------------------------
// No protocol/HMAC/secret logic here -- this page only ever calls the
// FastAPI backend's JSON API (app.py), which does all of that via the
// device_api package. The one secret this page ever handles is an admin
// secret the OPERATOR chooses to type in (or a freshly changed one shown
// back after "Change admin secret") -- never anything read off the wire.
// ----------------------------------------------------------------------
let devices = [];
let selectedIndices = new Set(); // survives renderDevices() rebuilds -- selection state lives here, not in the DOM

// Broadcast-address dropdown -- lists each local network interface's own
// broadcast address (computed server-side from IP+netmask, see app.py's
// /api/interfaces) so picking the right one on a multi-homed machine
// (Wi-Fi to the luminaire's router + a wired connection to a different
// one, a common case) doesn't require manually running ipconfig and
// doing the subnet math by hand.
async function loadInterfaces() {
  const select = document.getElementById('bcastSelect');
  try {
    const resp = await fetch('/api/interfaces');
    const data = await resp.json();
    for (const iface of (data.interfaces || [])) {
      const opt = document.createElement('option');
      opt.value = iface.broadcast;
      opt.textContent = `${iface.interface} (${iface.address}) -> ${iface.broadcast}`;
      select.appendChild(opt);
    }
  } catch (e) { /* dropdown just stays at "Interface..." -- the manual text field still works */ }
}

function applyBcastSelection(select) {
  if (select.value) document.getElementById('bcast').value = select.value;
}

window.addEventListener('DOMContentLoaded', loadInterfaces);

function pill(text, cls) { return `<span class="pill ${cls}">${text}</span>`; }
function row(label, value) { return `<div class="row"><span class="label">${label}</span> <span>${value}</span></div>`; }

function renderDevices() {
  const el = document.getElementById('devices');
  if (!devices.length) {
    el.innerHTML = '<div class="empty">No unit responded. Try Scan again, or check the broadcast address.</div>';
    updateBulkBar();
    return;
  }
  el.innerHTML = devices.map((d, i) => {
    const power = d.poe_ready ? pill('ready', 'on') : pill(d.power_blocking_reason || 'not ready', 'warn');
    const driver = d.driver_on ? pill(`on ${d.dim_percent}%`, 'on') : pill('off', 'off');
    const desired = d.desired_on ? pill('on', 'on') : pill('off', 'off');
    const gate = (name, ok) => pill(name, ok ? 'on' : 'err');
    return `
    <div class="card" id="card-${i}">
      <input type="checkbox" class="select-check" id="select-${i}"
             ${selectedIndices.has(i) ? 'checked' : ''} onchange="toggleSelect(${i}, this.checked)"
             title="Select for bulk actions">
      <h2>${d.serial}</h2>

      <div class="section-label">Device info</div>
      <div class="sub">${d.source_ip} &middot; fw ${d.fw_version} &middot; ${d.mac}</div>

      <hr class="divider">

      <div class="section-label">Device status</div>
      <div class="info">
        ${row('Uptime', `${d.uptime_s}s`)}
        ${row('Last reset reason', d.reset_reason)}
        ${row('Power', `${power} &middot; source: ${d.poe_source}`)}
        ${row('Power gates', `${gate('CDB', d.poe_cdb_confirmed)} ${gate('T2P', d.poe_t2p_confirmed)} ${gate('VBUS', d.poe_vbus_confirmed)}`)}
        ${row('Driver (actual)', driver)}
        ${row('Driver (desired)', `${desired}${(d.desired_on && !d.driver_on) ? '  (pending -- will apply once power is confirmed)' : ''}`)}
        ${row('Ramp/blink in progress', d.ramp_pending ? pill('yes', 'warn') : pill('no', 'off'))}
        ${row('VBUS', `${d.vbus_mv}mV`)}
        ${row('LED voltage', `${d.led_voltage_mv}mV`)}
      </div>
      <div class="center-row"><button class="btn" onclick="showStatus(${i})">Get status</button></div>

      <hr class="divider">

      <div class="section-label">Light controls</div>
      <div class="controls">
        <div class="controls-row">
          <button class="btn btn-fill" onclick="cmd(${i},'on')">On</button>
          <button class="btn btn-fill" onclick="cmd(${i},'off')">Off</button>
          <button class="btn btn-fill" onclick="cmd(${i},'identify')">Identify</button>
        </div>
        <div class="controls-row dim-row">
          <span class="dim-label">Dimming</span>
          <div class="dim-wrap">
            <span class="dim-tip" id="dim-tip-${i}">${d.dim_percent}%</span>
            <input type="range" min="0" max="100" step="1" value="${d.dim_percent}"
                   oninput="dimSliderInput(${i}, this)" onchange="dimSliderCommit(${i}, this)">
          </div>
        </div>
      </div>

      <hr class="divider">
      
      <div class="section-label section-label-sub">Admin controls</div>
      <div class="controls">
        <div class="controls-row">
          <button class="btn btn-danger btn-fill" onclick="cmd(${i},'reboot')">Reboot</button>
          <button class="btn btn-danger btn-fill" onclick="factoryReset(${i})">Factory reset</button>
          <button class="btn btn-danger btn-fill" onclick="changeSecret(${i})">Change secret</button>
        </div>
      </div>

      <hr class="divider">

      <div class="section-label">OTA</div>
      <div class="ota">
        <div class="ota-row">
          <input type="file" id="ota-file-${i}" accept=".bin">
          <button class="btn" onclick="uploadOta(${i})" id="ota-btn-${i}">Upload firmware</button>
        </div>
        <div class="ota-progress" id="ota-progress-${i}"><div class="ota-bar" id="ota-bar-${i}">0%</div></div>
      </div>

      <div class="msg" id="msg-${i}"></div>
    </div>`;
  }).join('');
  updateBulkBar();
}

const MSG_DISPLAY_MS = 2000; // how long a card's status message stays visible before auto-hiding
const msgTimers = {}; // per-card index -> pending setTimeout id, so a fast second message doesn't get hidden early by the first one's timer

function showMsg(i, text, ok) {
  const el = document.getElementById(`msg-${i}`);
  el.textContent = text;
  el.className = `msg show ${ok ? 'ok' : 'err'}`;

  if (msgTimers[i]) clearTimeout(msgTimers[i]);
  msgTimers[i] = setTimeout(() => {
    const current = document.getElementById(`msg-${i}`); // re-fetch -- renderDevices() may have rebuilt the DOM since this timer was set
    if (current) current.classList.remove('show');
    delete msgTimers[i];
  }, MSG_DISPLAY_MS);
}

// Bulk actions -- a selection (checkbox per card, state kept in
// selectedIndices, not the DOM) plus a toolbar that runs the same
// per-device functions already defined below (cmd(), factoryReset(),
// changeSecret()) sequentially over every selected unit. Sequential, not
// parallel: several of those functions can open the shared #secretDialog
// to ask the operator for a secret, and that dialog only supports one
// concurrent use.
function toggleSelect(i, checked) {
  if (checked) selectedIndices.add(i); else selectedIndices.delete(i);
  updateBulkBar();
}

function clearSelection() {
  selectedIndices.clear();
  renderDevices();
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const n = selectedIndices.size;
  document.getElementById('bulkCount').textContent = `${n} selected`;
  bar.classList.toggle('show', n > 0);
}

function selectedSerials() {
  return [...selectedIndices].map((i) => devices[i]?.serial).filter(Boolean);
}

async function runBulk(fn) {
  for (const i of [...selectedIndices]) {
    if (devices[i]) await fn(i);
  }
}

async function bulkOn() { await runBulk((i) => cmd(i, 'on')); }
async function bulkOff() { await runBulk((i) => cmd(i, 'off')); }
async function bulkIdentify() { await runBulk((i) => cmd(i, 'identify')); }
async function bulkStatus() { await runBulk((i) => showStatus(i)); }

function bulkDimInput(el) {
  const tip = document.getElementById('bulk-dim-tip');
  tip.textContent = `${el.value}%`;
  tip.classList.add('show');
  const pct = (el.value - el.min) / (el.max - el.min);
  const thumbWidth = 16;
  tip.style.left = `${thumbWidth / 2 + pct * (el.offsetWidth - thumbWidth)}px`;
}

async function bulkDimCommit(el) {
  document.getElementById('bulk-dim-tip').classList.remove('show');
  await runBulk((i) => cmd(i, 'dim', { percent: +el.value }));
}

async function bulkReboot() {
  const serials = selectedSerials();
  if (!serials.length) return;
  if (!confirm(`Reboot ${serials.length} unit(s)?\n\n${serials.join('\n')}`)) return;
  await runBulk((i) => cmd(i, 'reboot'));
}

async function bulkFactoryReset() {
  const serials = selectedSerials();
  if (!serials.length) return;
  const typed = prompt(`Type RESET to confirm FACTORY_RESET on ${serials.length} unit(s):\n\n${serials.join('\n')}`);
  if (typed !== 'RESET') return;
  // Skips factoryReset(i)'s own per-unit "type the exact serial" prompt --
  // the confirmation above already covers the whole selected set -- and
  // calls the same underlying command directly instead.
  await runBulk((i) => cmd(i, 'factory_reset', { confirm_serial: devices[i].serial }));
}

async function bulkChangeSecret() {
  const serials = selectedSerials();
  if (!serials.length) return;
  const typed = prompt(`Type CONFIRM to generate and set a new random admin secret on ${serials.length} unit(s):\n\n${serials.join('\n')}`);
  if (typed !== 'CONFIRM') return;
  // Always a fresh random secret per unit -- reusing one secret across
  // multiple physical units would be a worse security practice, so bulk
  // change-secret never offers changeSecret(i)'s "type one in" choice.
  await runBulk((i) => doChangeSecret(i, null));
}

async function scanDevices() {
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.textContent = 'Scanning...';
  try {
    const bcast = document.getElementById('bcast').value.trim();
    const url = '/api/scan' + (bcast ? `?broadcast=${encodeURIComponent(bcast)}` : '');
    const resp = await fetch(url);
    const data = await resp.json();
    devices = data.devices || [];
    selectedIndices.clear(); // indices are only meaningful within one scan's result set
    renderDevices();
  } catch (e) {
    document.getElementById('devices').innerHTML = `<div class="empty">Scan failed: ${e}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Scan network';
  }
}

async function refreshOne(i) {
  const d = devices[i];
  const resp = await fetch(`/api/devices/${d.source_ip}/info`);
  if (resp.ok) {
    devices[i] = await resp.json();
    renderDevices();
  }
  return resp.ok;
}

async function showStatus(i) {
  const d = devices[i];
  const ok = await refreshOne(i);
  if (!ok) showMsg(i, 'Failed to fetch status.', false);
}

function promptForSecret(message) {
  return new Promise((resolve) => {
    const dlg = document.getElementById('secretDialog');
    document.getElementById('secretDialogMsg').textContent = message;
    const input = document.getElementById('secretDialogInput');
    input.value = '';
    dlg.showModal();
    const ok = document.getElementById('secretDialogOk');
    const onOk = () => { dlg.close(); ok.removeEventListener('click', onOk); resolve(input.value.trim() || null); };
    ok.addEventListener('click', onOk);
    dlg.addEventListener('cancel', () => resolve(null), { once: true });
  });
}

async function postJson(url, body) {
  const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const data = await resp.json().catch(() => ({}));
  return { ok: resp.ok, status: resp.status, data };
}

// Live tooltip while dragging the dim slider -- oninput fires continuously
// during the drag (no command sent yet, just the tooltip); onchange fires
// once on release, which is when dimSliderCommit() actually sends DIM.
function dimSliderInput(i, el) {
  const tip = document.getElementById(`dim-tip-${i}`);
  tip.textContent = `${el.value}%`;
  tip.classList.add('show');
  const pct = (el.value - el.min) / (el.max - el.min);
  const thumbWidth = 16; // approximate -- native range thumbs aren't queryable, this is close enough across browsers
  const left = thumbWidth / 2 + pct * (el.offsetWidth - thumbWidth);
  tip.style.left = `${left}px`;
}

function dimSliderCommit(i, el) {
  document.getElementById(`dim-tip-${i}`).classList.remove('show');
  cmd(i, 'dim', { percent: +el.value });
}

async function cmd(i, action, extra) {
  const d = devices[i];
  let secretHex = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    const body = Object.assign({}, extra, secretHex ? { secret_hex: secretHex } : {});
    const { ok, status, data } = await postJson(`/api/devices/${d.source_ip}/${action}`, body);
    if (ok) {
      // Refresh BEFORE showing the message, not after -- refreshOne()
      // calls renderDevices(), which rebuilds this card's whole innerHTML
      // (including a fresh, empty .msg element) and would otherwise wipe
      // the message out right after showMsg() set it, well before its
      // 2s auto-hide timer ever got a chance to run it out naturally.
      await refreshOne(i);
      if (data.applied) showMsg(i, `${action}: applied.`, true);
      else if (data.pending) showMsg(i, `${action}: accepted, will apply once power is confirmed.`, true);
      else showMsg(i, `${action}: refused (${data.status}).`, false);
      return;
    }
    if (status === 401 && data.error === 'auth_needed' && attempt === 0) {
      secretHex = await promptForSecret(`No known admin secret works for ${d.serial}. Enter one to try:`);
      if (!secretHex) { showMsg(i, 'Cancelled -- no secret provided.', false); return; }
      continue;
    }
    showMsg(i, data.message || `${action} failed (HTTP ${status}).`, false);
    return;
  }
}

async function factoryReset(i) {
  const d = devices[i];
  const typed = prompt(`Type the exact serial to confirm FACTORY_RESET (${d.serial}):`);
  if (typed !== d.serial) { showMsg(i, 'Cancelled -- serial did not match.', false); return; }
  await cmd(i, 'factory_reset', { confirm_serial: typed });
}

async function changeSecret(i) {
  const choice = confirm('OK = generate a random secret.\nCancel = type one in.');
  let newSecretHex = null;
  if (!choice) {
    const typed = prompt('New admin secret (64 hex characters):');
    if (!typed) return;
    newSecretHex = typed.trim();
  }
  await doChangeSecret(i, newSecretHex);
}

// Shared by changeSecret(i) (single unit, operator picks random-or-typed)
// and bulkChangeSecret() (always random, one call per selected unit).
async function doChangeSecret(i, newSecretHex) {
  const d = devices[i];
  let secretHex = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    const body = Object.assign({}, newSecretHex ? { new_secret_hex: newSecretHex } : {}, secretHex ? { secret_hex: secretHex } : {});
    const { ok, status, data } = await postJson(`/api/devices/${d.source_ip}/change_secret`, body);
    if (ok) {
      showMsg(i, `Secret changed. New secret: ${data.new_secret_hex}`, true);
      return;
    }
    if (status === 401 && data.error === 'auth_needed' && attempt === 0) {
      secretHex = await promptForSecret(`No known admin secret works for ${d.serial}. Enter the CURRENT one to try:`);
      if (!secretHex) { showMsg(i, 'Cancelled -- no secret provided.', false); return; }
      continue;
    }
    showMsg(i, data.message || `change_secret failed (HTTP ${status}).`, false);
    return;
  }
}

// OTA -- pushes a .bin over an HTTP multipart upload to the backend,
// which then relays it to the device over the admin UDP channel (see
// device_api.client.AdminClient.ota_update()); this page never speaks the
// device protocol directly. While the upload is in flight, a separate
// poll loop reads /ota/progress to animate the bar -- the upload response
// itself only arrives once the whole transfer (and the device's final
// validation) is done. NOTE: picking a file, then clicking any OTHER
// button on ANY card before hitting "Upload firmware", clears the file
// picker -- this page always rebuilds the whole card list from scratch
// (renderDevices()), which resets file inputs like any other DOM node.
async function pollOtaProgress(i, ip, stopFlag) {
  const bar = document.getElementById(`ota-bar-${i}`);
  const wrap = document.getElementById(`ota-progress-${i}`);
  wrap.classList.add('show');
  while (!stopFlag.stopped) {
    try {
      const resp = await fetch(`/api/devices/${ip}/ota/progress`);
      if (resp.ok) {
        const p = await resp.json();
        const pct = p.total_bytes ? Math.round(100 * p.bytes_sent / p.total_bytes) : 0;
        bar.style.width = pct + '%';
        bar.textContent = `${pct}% (${p.state})`;
      }
    } catch (e) { /* keep polling -- a single missed poll doesn't matter */ }
    await new Promise((resolve) => setTimeout(resolve, 300));
  }
}

async function uploadOta(i) {
  const d = devices[i];
  const fileInput = document.getElementById(`ota-file-${i}`);
  const file = fileInput.files[0];
  if (!file) { showMsg(i, 'Choose a .bin file first.', false); return; }

  const btn = document.getElementById(`ota-btn-${i}`);
  btn.disabled = true;
  const stopFlag = { stopped: false };
  const pollPromise = pollOtaProgress(i, d.source_ip, stopFlag);

  try {
    let secretHex = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      const form = new FormData();
      form.append('file', file);
      if (secretHex) form.append('secret_hex', secretHex);

      const resp = await fetch(`/api/devices/${d.source_ip}/ota/upload`, { method: 'POST', body: form });
      const data = await resp.json().catch(() => ({}));

      if (resp.ok) {
        if (data.applied) {
          showMsg(i, 'Firmware validated and staged. Reboot to apply it.', true);
          if (confirm(`${d.serial}: OTA staged successfully. Reboot now to apply it?`)) {
            await cmd(i, 'reboot');
          }
        } else {
          showMsg(i, `Device refused the image (${data.status}).`, false);
        }
        return;
      }
      if (resp.status === 401 && data.error === 'auth_needed' && attempt === 0) {
        secretHex = await promptForSecret(`No known admin secret works for ${d.serial}. Enter one to try:`);
        if (!secretHex) { showMsg(i, 'Cancelled -- no secret provided.', false); return; }
        continue;
      }
      showMsg(i, data.message || `OTA upload failed (HTTP ${resp.status}).`, false);
      return;
    }
  } finally {
    stopFlag.stopped = true;
    await pollPromise;
    btn.disabled = false;
  }
}
</script>
